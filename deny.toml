[licenses]
allow = [
    "Apache-2.0",
    "BSD-3-Clause",
    "MIT",
    "Unicode-3.0",
]
confidence-threshold = 1.0

[bans]
multiple-versions = "deny"
wildcards = "deny"
# Allow path dependencies within the workspace.
allow-wildcard-paths = true
skip = [{ name = "syn" , version = "2.0" }]

[bans.workspace-dependencies]
duplicates = "deny"
